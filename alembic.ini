[alembic]
script_location = alembic
prepend_sys_path = .
# Overridden at runtime by the DATABASE_URL env var via alembic/env.py.
# Placeholder only — never put real credentials here.
sqlalchemy.url = postgresql://localhost/ai_audit

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
