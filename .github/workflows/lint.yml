name: Lint

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Run ruff (error-focused)
        run: ruff check . --select E9,F63,F7,F82

      # Class guard for silent_failure (pack-class-silent-failure); tests/test_silent_failure_guard.py
      # is the same rule in stdlib and also requires a reason on each noqa for it.
      - name: Run ruff (silent-failure guard)
        run: ruff check . --select B905,S110,S112 --exclude tests/fixtures
