name: Deploy demo

# Publishes the hosted demo (auditor.dragonhound.dev, Cloudflare Pages project ai-code-auditor, #199) from every dev
# commit whose Tests run passed. Production is the Pages branch `main`; any other --branch is only a preview.
#
# Secrets: CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID; without them the job
# builds, then skips the upload with a notice. OPSEC_DENYLIST (the deny-list's terms, one per line) makes the build
# re-check the tape against it; the tape was already gated with it when it was recorded.

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Only dev itself: a pull request's run, or a dispatch from another branch, never deploys.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pages
      cancel-in-progress: true
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      # Runs can finish out of order; an older commit must not replace a newer one.
      - id: head
        run: |
          head=$(git ls-remote origin refs/heads/dev | cut -f1)
          [ -n "$head" ] || { echo "::error::could not read dev"; exit 1; }
          if [ "$head" = "$SHA" ]; then echo "current=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::dev has moved past ${SHA::7}; its own run deploys."; fi

      - if: steps.head.outputs.current == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - if: steps.head.outputs.current == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - if: steps.head.outputs.current == 'true'
        run: node demo/vendor/dh/sync-shared.mjs --check . --against https://dragonhound.dev/brand/v1/manifest.json --allow-outdated

      - if: steps.head.outputs.current == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - if: steps.head.outputs.current == 'true'
        env:
          OPSEC_DENYLIST: ${{ secrets.OPSEC_DENYLIST }}
          BUILD_SHA: ${{ env.SHA }}
        run: |
          if [ -n "$OPSEC_DENYLIST" ]; then
            printf '%s\n' "$OPSEC_DENYLIST" > "$RUNNER_TEMP/denylist.txt"
            export AI_AUDIT_OPSEC_DENYLIST="$RUNNER_TEMP/denylist.txt"
          else
            echo "::notice::OPSEC_DENYLIST not set; the build re-checks paths, addresses and emails only."
          fi
          python demo/build.py

      - if: steps.head.outputs.current == 'true' && env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; built ${SHA::7} but did not deploy."

      - if: steps.head.outputs.current == 'true' && env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4.162.0 pages deploy demo/out
          --project-name ai-code-auditor --branch main
          --commit-hash "$SHA" --commit-message "dev ${SHA::7}"

      # The old site answers 200 too, so wait for the page that carries this build's sha.
      - if: steps.head.outputs.current == 'true' && env.HAS_TOKEN == 'true'
        run: |
          for _ in $(seq 1 15); do
            if curl -fsS https://auditor.dragonhound.dev/ | grep -q "name=\"build\" content=\"$SHA\""; then
              echo "auditor.dragonhound.dev serves ${SHA::7}"; exit 0
            fi
            sleep 6
          done
          echo "::error::auditor.dragonhound.dev isn't serving ${SHA::7}"; exit 1
