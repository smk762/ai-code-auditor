name: Migrations

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  alembic-upgrade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: audit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d audit_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI uses the ephemeral Postgres service container on its default port.
      # The 5433 prod-host convention (192.168.1.121:5433) does not apply here.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/audit_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Alembic upgrade
        run: alembic upgrade head

      - name: Verify Alembic head
        run: alembic current
