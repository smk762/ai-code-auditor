# Role contracts over repo-to-repo Python imports (#57; ecosystem/arch_contracts.py). Every role
# named here must be held by a repo in service_roles, and every rule must be able to match
# something, or loading fails. One violation per (importer, imported) repo pair.
rules:
  - name: service_boundary
    description: >-
      A UI repo talks to its worker over HTTP (call_graph_rules), so its runtime code must not
      import a worker's package. Tests and dev scripts (fixture recording, demo bundling) may.
    severity: MEDIUM
    forbid:
      - from_roles: [ui]
        to_roles: [worker]
    exclude_paths: ["tests/*", "*/tests/*", "test_*.py", "*/test_*.py", "scripts/*", "*/scripts/*"]

  - name: dependency_direction
    description: >-
      argus-cortex is the shared library every service builds on; it must import no service or
      tooling repo, tests included, or the suite gets a dependency cycle.
    severity: HIGH
    forbid:
      - from_roles: [library]
        to_roles: [worker, ui, tooling]

# Service roles for the Argus suite + shared dependencies.
service_roles:
  - name: argus-cortex
    role: library
  - name: argus-quarry
    role: worker
  - name: argus-curator
    role: worker
  - name: argus-cull
    role: ui
  - name: argus-lens
    role: worker
  - name: argus-lightbox
    role: ui
  - name: argus-studio
    role: ui
  - name: argus-darkroom
    role: worker
  - name: argus-safelight
    role: ui
  - name: argus-forge
    role: worker
  - name: argus-proof
    role: worker
  - name: argus-puppet
    role: worker
  - name: argus-atlas
    role: worker
  # imports argus_atlas at runtime (chunk addressing, a declared dependency) and runs its own
  # server, so it is not a thin HTTP UI
  - name: argus-realms
    role: worker
  - name: argus-survey
    role: worker
  - name: argus-sightline
    role: ui
  - name: argus-mint
    role: worker
  - name: argus-assay
    role: ui
  - name: argus-mask
    role: worker
  - name: argus-echo
    role: worker
  - name: argus-retina
    role: worker
  - name: argus-iris
    role: worker
  - name: argus-scout
    role: worker
  # the maintainers' release broadcaster (its own loopback UI), not a UI over a worker
  - name: argus-herald
    role: tooling
  - name: argus-handbook
    role: tooling
  - name: argus-halo
    role: tooling
  - name: argus-ci
    role: tooling
  - name: argus-pkg-template
    role: tooling
  - name: agent-composer
    role: worker
  - name: voluptas
    role: worker
  - name: ai-code-auditor
    role: tooling

# Permitted inter-service HTTP edges (expand as Argus wiring hardens).
call_graph_rules:
  allowed_calls:
    - from: argus-darkroom
      to: voluptas
      note: "Guarded generation runs on ComfyUI"
    - from: argus-studio
      to: voluptas
      note: "Studio may submit ComfyUI workflows"
    - from: argus-safelight
      to: argus-darkroom
    - from: argus-cull
      to: argus-curator
    - from: argus-assay
      to: argus-mint
    - from: argus-sightline
      to: argus-survey
    - from: argus-lightbox
      to: argus-lens
    - from: argus-forge
      to: argus-curator
    - from: argus-proof
      to: argus-forge
    - from: argus-puppet
      to: argus-curator
      note: "Opt-in age check (curator POST /faces)"
    - from: argus-herald
      to: argus-mint
      note: "Pulls approved teasers (GET /posts/ready) and reports posts back (ARGUS_MINT_URL)"
    - from: argus-scout
      to: argus-echo
      note: "Speech for voice channels (POST /synthesise/stream; services.echo.url)"
    - from: argus-scout
      to: argus-mask
      note: "mask voice channel (GET /health, POST /push; the channel's url)"
    - from: argus-iris
      to: voluptas
      note: "Reads ComfyUI queue and system stats for GPU residency (a configured service)"
    - from: "*"
      to: agent-composer
      note: "Suite consumes chat/RAG via agent-composer"
    - from: "*"
      to: argus-cortex
      note: "Shared taxonomy / wire schemas"

  service_url_env_vars:
    - env_fragment: AGENT_COMPOSER
      service: agent-composer
    - env_fragment: RAG_
      service: agent-composer
    - env_fragment: COMFYUI
      service: voluptas
    - env_fragment: VOLUPTAS
      service: voluptas
    - env_fragment: ARGUS_CORTEX
      service: argus-cortex
    - env_fragment: DARKROOM
      service: argus-darkroom
    - env_fragment: CURATOR
      service: argus-curator
    - env_fragment: LENS
      service: argus-lens

domain_ownership:
  - domain: taxonomy_and_wire_schema
    description: "Shared Argus taxonomy and versioned wire schemas — owned by argus-cortex"
    owner: argus-cortex
    severity: HIGH
    forbidden_in:
      - argus-cull
      - argus-safelight
      - argus-lightbox
      - argus-sightline
      - argus-assay

  - domain: comfyui_runtime
    description: "ComfyUI process and GPU sidecar control — owned by voluptas"
    owner: voluptas
    severity: HIGH
    forbidden_in:
      - argus-studio
      - argus-safelight
      - argus-cull

  - domain: rag_and_chat
    description: "RAG ingest, Qdrant collections, chat gateway — owned by agent-composer"
    owner: agent-composer
    severity: MEDIUM
    forbidden_in:
      - argus-halo
      - argus-ci
