# Rest windows for night conductor sessions (IANA timezone; default UTC).
# A host can run the window in local time with AI_AUDIT_REST_TZ (e.g. Australia/Perth) in .env;
# the env var overrides `timezone` below. Keep it equal to the host TZ the systemd timers use.
timezone: UTC
windows:
  - name: nightly
    start: "00:30"
    end: "06:00"
wrap_up_before_end_minutes: 20
# Soft wait for in-flight workers after freeze (seconds).
inflight_grace_s: 120
max_tasks_per_session: 12
