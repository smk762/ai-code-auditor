# Night conductor scan set: all https://github.com/smk762/argus-* repos
# plus shared deps the suite consumes (agent-composer, voluptas).
# mithrandir is omitted (HTTP status handoff only).
# Prefer local checkouts under /home/smk/<name>; otherwise /home/smk/mirrors/<name>
# (see config/repo_mirrors.yaml + scripts/sync_repo_mirrors.sh). Scan branch: dev.
repos:
  - name: argus-assay
    path: /home/smk/mirrors/argus-assay
    branch: dev
    enabled: true
    provider: local
    subpath: ""

  - name: argus-atlas
    path: /home/smk/mirrors/argus-atlas
    branch: dev
    enabled: true
    provider: local
    subpath: ""

  - name: argus-ci
