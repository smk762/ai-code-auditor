    branch: dev
    enabled: true
    provider: local
    subpath: ""

  - name: argus-cull
    path: /home/smk/argus-cull
    branch: dev
    enabled: true
    provider: local
    subpath: ""

  - name: argus-curator
    path: /home/smk/mirrors/argus-curator
    branch: dev
    enabled: true
    provider: local
    subpath: ""

  - name: argus-darkroom
    path: /home/smk/mirrors/argus-darkroom
