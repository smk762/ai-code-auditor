# Night conductor scan set: all https://github.com/smk762/argus-* repos except argus-docs
# (the generated docs bundle this tool writes), plus shared deps the suite consumes
# (agent-composer, voluptas) and this repo. mithrandir is omitted (HTTP status handoff only).
# Keep in step with config/repo_mirrors.yaml (tests/test_repo_sets.py).
# Prefer local checkouts under ~/<name>; otherwise ~/mirrors/<name>
# (see config/repo_mirrors.yaml + scripts/sync_repo_mirrors.sh). Scan branch: dev.
repos:
  - name: argus-assay
    path: ~/mirrors/argus-assay
    branch: dev
    enabled: true
    provider: local
    subpath: ""

  - name: argus-atlas
