  - name: argus-mask
    path: /home/smk/mirrors/argus-mask
    branch: dev
    enabled: true
    provider: local
    subpath: ""

  - name: argus-mint
    path: /home/smk/mirrors/argus-mint
    branch: dev
    enabled: true
    provider: local
    subpath: ""

  - name: argus-pkg-template
    path: /home/smk/mirrors/argus-pkg-template
    branch: dev
