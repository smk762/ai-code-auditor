  # Shared deps Argus consumes
  - name: agent-composer
    path: /home/smk/agent-composer
    branch: dev
    enabled: true
    provider: local
    subpath: ""

  - name: voluptas
    path: /home/smk/mirrors/voluptas
    branch: dev
    enabled: true
    provider: local
    subpath: ""

output_dir: reports
graph_db_path: graph/ecosystem_graph.db
embedding_index_path: index/code_embeddings.faiss
architecture_memory_path: memory/architecture_memory.md
auth_mode: false
auth_code_env: AI_AUDIT_AUTH_CODE
log_level: INFO
log_file_path: pipeline.log

# RAG isolation — keep audit knowledge in its own Qdrant collection so it does
# not pollute the general-purpose chat RAG in agent-composer (project_docs).
rag_collection: audit_docs
# Use host.docker.internal so the dockerised audit-api can reach the
# rag-ingest service running on the host (compose adds the host-gateway entry).
# Bare-metal/host-network runs can override with AI_AUDIT_RAG_INGEST_URL=http://127.0.0.1:9050/ingest.
rag_ingest_url: http://host.docker.internal:9050/ingest
