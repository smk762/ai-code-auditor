x-auditor-base: &auditor-base
  build: .
  # An init process as PID 1 reaps orphans. git detaches background gc, which is re-parented to
  # PID 1 on exit; uvicorn never reaps them, and ~75k zombies exhausted the container's pids.
  init: true
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  env_file:
    - .env
  volumes:
    - ./reports:/app/reports
    - ./graph:/app/graph
    - ./index:/app/index
    - ./memory:/app/memory
    # Approved architecture rules (AI_AUDIT_ARCH_RULES_PATH, default rules/architecture_rules.json):
    # outside git, written by the API's Approve button, merged into config/architecture_rules.yaml.
    - ./rules:/app/rules
    - ./:/repos/ai-code-auditor
    # Match repo `path:` entries in config/ecosystem.yaml (host paths → same path in container),
    # read-only. The wiki viewer, "Ask this repo" citations, repo cards and the topology scan all
    # read these mirrors; without them citations fail as "missing". Most repos are git mirrors
    # under ~/mirrors (synced by scripts/sync_repo_mirrors.sh); three are checkouts in ~.
    # Add a line here when a repo's path in ecosystem.yaml is outside these.
    - ${HOME}/mirrors:${HOME}/mirrors:ro
    - ${HOME}/agent-composer:${HOME}/agent-composer:ro
    - ${HOME}/argus-cull:${HOME}/argus-cull:ro
    - ${HOME}/argus-lens:${HOME}/argus-lens:ro
  environment:
    # Match the host clock so ledger/dashboard hours line up with the systemd timers.
    - TZ=${TZ:-Australia/Perth}
    - DATABASE_URL=${DATABASE_URL}
    - DB_POOL_SIZE=${DB_POOL_SIZE}
    - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW}
    - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT}
    - REDIS_URL=${REDIS_URL}
    - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
    - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
    - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
    - S3_BUCKET=${S3_BUCKET}
    - S3_REGION=${S3_REGION}
    - JWT_ISSUER=${JWT_ISSUER}
    - JWT_AUDIENCE=${JWT_AUDIENCE}
    - JWT_SECRET=${JWT_SECRET}
    - JWT_ALGORITHM=${JWT_ALGORITHM}
    - AI_AUDIT_LLM_ENDPOINT=${AI_AUDIT_LLM_ENDPOINT}
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # Batch / scheduled job: runs ecosystem audit once then exits. For daily runs use host cron or
  # systemd timer with: docker compose run --rm --no-deps auditor (see contrib/systemd/user).
  # `docker compose up` also starts this once for dev/smoke; production often runs only audit-api
  # continuously and triggers auditor on a schedule.
  auditor:
    <<: *auditor-base
    container_name: ai-code-auditor
    command: sh -lc "python -m auditor.bootstrap_db && alembic upgrade head && python pipelines/ecosystem_audit.py"

  # Long-running HTTP API — POST /audit/run, GET /audit/runs/{id}, GET /audit/health, POST /audit/ingest
  audit-api:
    <<: *auditor-base
    container_name: audit-api
    # Stay up: come back after a crash and on boot (Docker starts with the host), unless stopped by hand.
    restart: unless-stopped
    # Lets the container resolve services running on the host (e.g. rag-ingest at
    # host.docker.internal:9050 referenced from config/ecosystem.yaml).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Default loopback-only; set AUDIT_API_BIND_IP=0.0.0.0 only behind a trusted proxy.
      - "${AUDIT_API_BIND_IP:-127.0.0.1}:${AUDIT_API_PORT:-8765}:8765"
    healthcheck:
      test: ["CMD", "sh", "-lc", "wget -qO- http://127.0.0.1:8765/audit/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: >
      sh -lc '
        python -m auditor.bootstrap_db &&
        alembic upgrade head &&
        exec uvicorn auditor.audit_api:app --host 0.0.0.0 --port 8765
      '
