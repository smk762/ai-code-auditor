[project]
name = "ai-code-auditor"
version = "0.1.0"
description = "Local-first multi-repo AI code auditor with governance and copilot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "requests>=2.32.0",
  "SQLAlchemy>=2.0.30",
  "alembic>=1.13.2",
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.7",
  "boto3>=1.34.0",
  "PyJWT>=2.9.0",
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
semantic = [
  "faiss-cpu>=1.8.0",
]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
ai-audit = "cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["auditor*", "ecosystem*", "patterns*", "semantic*", "copilot*", "pipelines*", "qa*"]
